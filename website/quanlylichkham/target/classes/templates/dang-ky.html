<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDCARE — Đặt lịch khám</title><link rel="stylesheet" href="/css/site.css"></head><body>
<header>
  <a href="/" class="logo">✚ MEDCARE</a>
  <nav>
    <a href="/">Trang chủ</a>
    <a th:if="${daDangNhap}" href="/bang-dieu-khien">Bảng điều khiển</a>
    <a th:if="${daDangNhap}" href="/dat-lich">Đặt lịch</a>
    <a th:unless="${daDangNhap}" href="/dang-nhap">Đăng nhập</a>
    <a th:unless="${daDangNhap}" href="/dang-ky">Đăng ký</a>
    <form th:if="${daDangNhap}" action="/dang-xuat" method="post" class="inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="navbtn" type="submit">Đăng xuất</button>
    </form>
  </nav>
</header><main><div th:if="${message}" class="alert ok" th:text="${message}"></div><div th:if="${error}" class="alert err" th:text="${error}"></div><section class="auth"><h1>Đăng ký bệnh nhân</h1><p class="muted">Nhân viên và bác sĩ được quản trị viên cấp tài khoản.</p><form method="post" action="/dang-ky"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Họ tên<input name="hoTen" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>Mật khẩu (tối thiểu 8 ký tự)<input name="password" type="password" minlength="8" required></label><button class="btn">Tạo tài khoản</button></form></section></main><footer>MEDCARE · Hệ thống đặt lịch khám và điều phối hàng đợi · Thời gian chờ chỉ là ước tính; mức ưu tiên do nhân viên xác nhận.</footer></body></html>
